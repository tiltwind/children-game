/* =========================================================
   实体绘制：僵尸
   ========================================================= */
function drawZombie(z){
  const base = z.y + 33;
  const s = z.size * 1.10;
  const sw = Math.sin(z.walk) * (z.moving ? 1 : 0.2);
  const hit = z.flash > 0.35;
  const skinA = hit ? (z.isBoss ? '#c68ea4' : '#bcd79b') : (z.isBoss ? '#b4819a' : '#8fb072');
  const skinB = hit ? (z.isBoss ? '#a06f85' : '#7c9c63') : (z.isBoss ? '#7d4b60' : '#5c7d4b');
  const cloth = hit ? (z.isBoss ? '#5e3140' : '#42533a') : (z.isBoss ? '#451a26' : '#2b3a24');
  const eye = z.isBoss ? '#ff7a4d' : '#ff4438';

  ctx.save();
  ctx.translate(z.x, base);
  ctx.scale(s, s);

  // 地面阴影
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.beginPath(); ctx.ellipse(3, 1, 21, 6.5, 0, 0, 6.3); ctx.fill();

  // BOSS 披风（垫在最底层）
  if(z.isBoss){
    ctx.fillStyle = 'rgba(48,12,22,0.92)';
    ctx.beginPath();
    ctx.moveTo(-14, -54); ctx.lineTo(-30, -16); ctx.lineTo(-20, -22); ctx.lineTo(-14, -4);
    ctx.lineTo(-4, -24); ctx.lineTo(6, -6); ctx.lineTo(10, -26);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(255,122,77,0.25)'; ctx.lineWidth = 1.2; ctx.stroke();

    // 头冠（向后倾斜，垫在头后面）
    for(let i = 0; i < 5; i++){
      ctx.fillStyle = '#2c121b';
      ctx.beginPath();
      ctx.moveTo(-18 + i * 5, -70 - i);
      ctx.lineTo(-27 + i * 5, -92 - i * 3);
      ctx.lineTo(-11 + i * 5, -70 - i);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(255,122,77,0.45)'; ctx.lineWidth = 1; ctx.stroke();
    }
    // 头冠底座的暖光
    ctx.save();
    ctx.shadowColor = 'rgba(255,110,70,0.7)'; ctx.shadowBlur = 10;
    ctx.strokeStyle = 'rgba(255,150,90,0.55)'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(-20, -71); ctx.lineTo(6, -76); ctx.stroke();
    ctx.restore();
  }

  // 腿
  ctx.save(); ctx.rotate(sw * 0.16);
  ctx.fillStyle = cloth;
  pathRR(ctx, -12, -28, 9, 28, 2); ctx.fill(); ctx.strokeStyle = 'rgba(0,0,0,0.75)'; ctx.lineWidth = 1.3; ctx.stroke();
  ctx.restore();
  ctx.save(); ctx.rotate(-sw * 0.16);
  ctx.fillStyle = cloth;
  pathRR(ctx, 1, -28, 9, 28, 2); ctx.fill(); ctx.strokeStyle = 'rgba(0,0,0,0.75)'; ctx.lineWidth = 1.3; ctx.stroke();
  ctx.restore();
  ctx.fillStyle = '#15190f';
  ctx.fillRect(-13, -5, 11, 5); ctx.fillRect(1, -5, 11, 5);

  // 躯干（前倾梯形）
  ctx.save();
  ctx.rotate(-0.10 + sw * 0.05);
  const bg = ctx.createLinearGradient(-16, 0, 16, 0);
  bg.addColorStop(0, skinB); bg.addColorStop(0.6, skinA); bg.addColorStop(1, skinB);
  ctx.fillStyle = bg;
  ctx.beginPath();
  ctx.moveTo(-13, -26); ctx.lineTo(11, -26); ctx.lineTo(16, -58); ctx.lineTo(-17, -55);
  ctx.closePath(); ctx.fill(); ol(1.8);
  if(z.isBoss){
    ctx.save();
    ctx.shadowColor = 'rgba(255,110,70,0.55)'; ctx.shadowBlur = 16;
    ctx.strokeStyle = 'rgba(255,140,95,0.5)'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-13, -26); ctx.lineTo(11, -26); ctx.lineTo(16, -58); ctx.lineTo(-17, -55);
    ctx.closePath(); ctx.stroke();
    ctx.restore();
  }
  // 破烂衣服
  ctx.fillStyle = cloth;
  ctx.fillRect(-14, -38, 27, 10);
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(-7, -34, 3, 10); ctx.fillRect(5, -37, 2, 12);
  // 肋骨高光
  ctx.strokeStyle = 'rgba(255,255,255,0.22)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(-6, -50); ctx.lineTo(-4, -46); ctx.moveTo(2, -50); ctx.lineTo(4, -46); ctx.stroke();

  // 手臂前伸
  const armY = -50 + sw * 3;
  ctx.strokeStyle = skinB; ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(9, -54); ctx.quadraticCurveTo(20, armY - 4, 27, armY); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(3, -50); ctx.quadraticCurveTo(15, armY + 2, 24, armY + 8); ctx.stroke();
  ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(9, -54); ctx.quadraticCurveTo(20, armY - 4, 27, armY); ctx.stroke();
  // 爪子
  ctx.fillStyle = skinA;
  for(let i = 0; i < 3; i++){
    ctx.beginPath(); ctx.ellipse(28 + i * 0.6, armY + i * 2 - 2, 2.2, 3.4, 0.4, 0, 6.3); ctx.fill();
  }
  ctx.beginPath(); ctx.arc(24, armY + 8, 3.6, 0, 6.3); ctx.fill();

  // 头（前伸，小一点）
  const hr = z.isBoss ? 11 : 9.5;
  ctx.fillStyle = skinA;
  ctx.beginPath(); ctx.arc(-8, -64, hr, 0, 6.3); ctx.fill(); ol(1.6);
  // 下颚
  ctx.fillStyle = skinB;
  ctx.beginPath(); ctx.ellipse(-3, -58, 5, 4, -0.2, 0, 6.3); ctx.fill();
  // 眼睛
  ctx.save();
  ctx.shadowColor = eye; ctx.shadowBlur = 14;
  ctx.fillStyle = eye;
  const er = z.isBoss ? 3.2 : 2.6;
  ctx.beginPath(); ctx.arc(-12.5, -67, er, 0, 6.3); ctx.fill();
  ctx.beginPath(); ctx.arc(-4.5, -68, er, 0, 6.3); ctx.fill();
  ctx.restore();
  // 嘴 + 牙
  ctx.fillStyle = '#20100d';
  pathRR(ctx, -14, -59, 10, 3.6, 2); ctx.fill();
  ctx.fillStyle = '#e8e2cb';
  ctx.fillRect(-12, -59, 2, 2.6); ctx.fillRect(-8, -59, 2, 2.6); ctx.fillRect(-4, -59, 2, 2.6);
  // 头顶轮廓光
  ctx.strokeStyle = 'rgba(200,255,170,0.35)'; ctx.lineWidth = 1.3;
  ctx.beginPath(); ctx.arc(-8, -65, 9, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
  ctx.restore();

  // 类型装饰
  if(z.key === 'tiny'){
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath(); ctx.arc(-8, -66, 4.5, 0.2, 1.6); ctx.fill();
  }
  if(z.key === 'runner'){
    ctx.strokeStyle = 'rgba(170,255,120,0.55)'; ctx.lineWidth = 1.5;
    for(let i = 0; i < 3; i++){
      ctx.beginPath(); ctx.moveTo(-26 - i * 7, -38 + i * 7); ctx.lineTo(-40 - i * 9, -38 + i * 7); ctx.stroke();
    }
  }
  if(z.key === 'armor'){
    // 铁头盔 + 肩甲
    ctx.fillStyle = '#55605a';
    ctx.beginPath(); ctx.arc(-8, -66, 11.5, Math.PI * 1.02, Math.PI * 2.05); ctx.fill(); ol(1.5);
    pathRR(ctx, -21, -68, 26, 4, 2); ctx.fill(); ol(1.2);
    ctx.fillStyle = 'rgba(255,92,77,0.7)';
    ctx.fillRect(-16, -69, 7, 2);
    ctx.fillStyle = '#48534d';
    pathRR(ctx, -15, -54, 9, 9, 3); ctx.fill(); ol(1.3);
    pathRR(ctx, 4, -56, 9, 9, 3); ctx.fill(); ol(1.3);
    ctx.fillStyle = '#3e4943';
    pathRR(ctx, -12, -50, 22, 15, 3); ctx.fill(); ol(1.4);
    ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.lineWidth = 1;
    pathRR(ctx, -12, -50, 22, 15, 3); ctx.stroke();
  }
  if(z.isBoss){
    // 肩甲尖刺
    ctx.fillStyle = '#3a1a24';
    for(const sx of [-16, 10]){
      ctx.beginPath(); ctx.moveTo(sx, -56); ctx.lineTo(sx + 6, -74); ctx.lineTo(sx + 12, -56); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.8)'; ctx.lineWidth = 1.2; ctx.stroke();
    }
    // 胸口核心
    const pulse = 0.6 + 0.4 * Math.sin(G.time * 4);
    ctx.save();
    ctx.shadowColor = '#ff3b3b'; ctx.shadowBlur = 24 * pulse;
    ctx.fillStyle = 'rgba(255,70,60,' + (0.65 + 0.3 * pulse) + ')';
    ctx.beginPath(); ctx.arc(-1, -44, 9.5, 0, 6.3); ctx.fill();
    ctx.restore();
  }
  ctx.restore();

  // 血条
  if(z.hp < z.maxHp && !z.isBoss){
    const w = 46 * s, h = 4;
    const bx = z.x - w / 2, by = z.y + 16 - 92 * s;
    ctx.fillStyle = 'rgba(0,0,0,0.72)'; ctx.fillRect(bx - 1, by - 1, w + 2, h + 2);
    ctx.fillStyle = z.hp / z.maxHp > 0.45 ? '#8ee06a' : '#ffb545';
    ctx.fillRect(bx, by, w * clamp(z.hp / z.maxHp, 0, 1), h);
  }
}

/* =========================================================
   子弹 / 粒子 / 天气
   ========================================================= */
function drawBullet(b){
  if(b.type === 'tracer'){
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createLinearGradient(b.x - 34, 0, b.x + 4, 0);
    g.addColorStop(0, 'rgba(127,227,255,0)'); g.addColorStop(1, 'rgba(200,250,255,0.95)');
    ctx.strokeStyle = g; ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.moveTo(b.x - 34, b.y); ctx.lineTo(b.x + 2, b.y); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath(); ctx.arc(b.x + 2, b.y, 2.2, 0, 6.3); ctx.fill();
    ctx.restore();
  } else if(b.type === 'gatling'){
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createLinearGradient(b.x - 20, 0, b.x + 2, 0);
    g.addColorStop(0, 'rgba(255,181,69,0)'); g.addColorStop(1, 'rgba(255,232,160,0.95)');
    ctx.strokeStyle = g; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(b.x - 20, b.y); ctx.lineTo(b.x + 2, b.y); ctx.stroke();
    ctx.restore();
  } else if(b.type === 'pellet'){
    ctx.fillStyle = 'rgba(255,180,130,0.9)';
    ctx.beginPath(); ctx.arc(b.x, b.y, 2.4, 0, 6.3); ctx.fill();
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = 'rgba(255,140,90,0.35)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(b.x - b.vx * 0.02, b.y - b.vy * 0.02); ctx.lineTo(b.x, b.y); ctx.stroke();
    ctx.restore();
  } else if(b.type === 'shell'){
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(255,181,69,0.55)';
    ctx.beginPath(); ctx.arc(b.x - 10, b.y, 9, 0, 6.3); ctx.fill();
    ctx.restore();
    ctx.fillStyle = '#ffe9b0';
    pathRR(ctx, b.x - 8, b.y - 3.5, 16, 7, 3); ctx.fill();
    ctx.fillStyle = '#8a5a20';
    ctx.fillRect(b.x - 2, b.y - 2, 6, 4);
  }
}

function drawParticles(){
  for(const p of G.parts){
    const a = clamp(p.life / p.maxLife, 0, 1);
    if(p.type === 'spark'){
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = p.color || '#ffd166';
      ctx.globalAlpha = a;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.4 + a * 0.8), 0, 6.3); ctx.fill();
      ctx.restore();
    } else if(p.type === 'goo'){
      ctx.fillStyle = p.color || '#7da35a';
      ctx.globalAlpha = a * 0.9;
      ctx.beginPath(); ctx.ellipse(p.x, p.y, p.size, p.size * 0.8, 0, 0, 6.3); ctx.fill();
      ctx.globalAlpha = 1;
    } else if(p.type === 'ring'){
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = a;
      ctx.strokeStyle = p.color || '#ffffff';
      ctx.globalAlpha = a * 0.6;
      ctx.lineWidth = 1.6 + a * 2;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (1 - a) + 4, 0, 6.3); ctx.stroke();
      ctx.restore();
    } else if(p.type === 'flash'){
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size * 2.6);
      g.addColorStop(0, hexA('#ffffff', 0.9 * a));
      g.addColorStop(0.4, hexA(p.color || '#ffb545', 0.55 * a));
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * 2.6, 0, 6.3); ctx.fill();
      ctx.restore();
    } else if(p.type === 'smoke'){
      ctx.save();
      ctx.globalAlpha = a * 0.55;
      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
      g.addColorStop(0, p.color || 'rgba(70,70,70,0.7)');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, 6.3); ctx.fill();
      ctx.restore();
    } else if(p.type === 'text'){
      ctx.save();
      ctx.globalAlpha = a;
      ctx.font = '700 ' + (p.size || 14) + 'px "Barlow Condensed","Noto Sans SC",sans-serif';
      ctx.textAlign = 'center';
      ctx.lineWidth = 3;
      ctx.strokeStyle = 'rgba(0,0,0,0.7)';
      ctx.strokeText(p.text, p.x, p.y);
      ctx.fillStyle = p.color || '#fff';
      ctx.fillText(p.text, p.x, p.y);
      ctx.restore();
    }
  }
}

function drawWeather(){
  const th = G.theme; if(!th) return;
  ctx.save();
  if(th.weather === 'rain'){
    ctx.strokeStyle = 'rgba(170,215,240,0.32)'; ctx.lineWidth = 1;
    for(const p of G.weather){
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + 5, p.y + p.len); ctx.stroke();
    }
  } else if(th.weather === 'snow'){
    for(const p of G.weather){
      ctx.fillStyle = 'rgba(230,246,255,' + (0.4 + 0.4 * Math.abs(Math.sin(p.sw))) + ')';
      ctx.beginPath(); ctx.arc(p.x + Math.sin(p.sw) * 4, p.y, p.r, 0, 6.3); ctx.fill();
    }
  } else if(th.weather === 'dust'){
    ctx.strokeStyle = 'rgba(255,207,116,0.16)'; ctx.lineWidth = 2;
    for(const p of G.weather){
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + p.len, p.y + 3); ctx.stroke();
    }
  } else if(th.weather === 'toxic'){
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for(const p of G.weather){
      ctx.fillStyle = 'rgba(166,255,107,0.22)';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.3); ctx.fill();
    }
    ctx.restore();
  } else {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for(const p of G.weather){
      const a = 0.3 + 0.5 * Math.abs(Math.sin(p.seed + G.time * 2));
      ctx.fillStyle = 'rgba(255,122,77,' + a + ')';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.3); ctx.fill();
    }
    ctx.restore();
  }
  ctx.restore();
}

/* ------- 投放预览 ------- */
function drawDeployGhost(){
  if(G.phase !== 'playing' || !G.sel || G.hoverLane < 0) return;
  const def = SOLDIERS[G.sel];
  const lane = G.hoverLane;
  const used = G.soldiers.filter(s => s.lane === lane).map(s => s.slot);
  let slot = -1;
  for(let i = 0; i < SLOTS.length; i++){ if(used.indexOf(i) < 0){ slot = i; break; } }
  const y = LANE_Y[lane];
  const can = slot >= 0 && G.energy >= def.cost;

  // 投放位标记
  for(let i = 0; i < SLOTS.length; i++){
    const x = SLOTS[i], occupied = used.indexOf(i) >= 0;
    ctx.save();
    ctx.translate(x, y + 3);
    ctx.strokeStyle = occupied ? 'rgba(255,255,255,0.15)' : hexA(def.accent, 0.7);
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-9, 0); ctx.lineTo(0, -6); ctx.lineTo(9, 0); ctx.lineTo(0, 6); ctx.closePath();
    ctx.stroke();
    if(i === slot && can){
      ctx.fillStyle = hexA(def.accent, 0.3);
      ctx.fill();
    }
    ctx.restore();
  }
  // 幽灵轮廓
  if(slot >= 0 && can){
    ctx.save();
    ctx.globalAlpha = 0.45;
    ctx.setLineDash([4, 4]);
    ctx.strokeStyle = def.accent;
    ctx.lineWidth = 1.5;
    pathRR(ctx, SLOTS[slot] - 26, y - 58, 52, 90, 6);
    ctx.stroke();
    ctx.restore();
  }
}

/* ------- 屏幕特效 ------- */
function drawOverlayFx(){
  // 暗角
  const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.42, W / 2, H / 2, H * 0.95);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.72)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);

  // 顶部渐变（HUD 底衬）
  const tg = ctx.createLinearGradient(0, 0, 0, 150);
  tg.addColorStop(0, 'rgba(4,8,11,0.9)'); tg.addColorStop(1, 'rgba(4,8,11,0)');
  ctx.fillStyle = tg; ctx.fillRect(0, 0, W, 150);

  // 基地危险红边
  if(G.phase === 'playing' || G.phase === 'result'){
    const pct = G.baseMax ? G.baseHp / G.baseMax : 1;
    if(pct < 0.4){
      const a = (0.35 - pct * 0.4) + 0.18 * Math.sin(G.time * 5);
      const rg = ctx.createLinearGradient(0, 0, 220, 0);
      rg.addColorStop(0, 'rgba(255,60,45,' + Math.max(0, 0.34 + a) + ')');
      rg.addColorStop(1, 'rgba(255,60,45,0)');
      ctx.fillStyle = rg; ctx.fillRect(0, 0, 220, H);
    }
  }

  // 白闪
  if(G.whiteFlash > 0){
    ctx.fillStyle = 'rgba(255,255,255,' + (G.whiteFlash * 0.55) + ')';
    ctx.fillRect(0, 0, W, H);
  }
  // 爆炸橙闪
  if(G.flash > 0){
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(255,120,60,' + (G.flash * 0.3) + ')';
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }
  // 扫描线
  ctx.save();
  ctx.globalAlpha = 0.045;
  ctx.fillStyle = '#000';
  for(let y = 0; y < H; y += 3) ctx.fillRect(0, y, W, 1);
  ctx.restore();
}
/* =========================================================
   交互与启动
   ========================================================= */
function fit(){
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  const frame = document.getElementById('frame');
  frame.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
}
window.addEventListener('resize', fit);

function evtPos(e){
  const r = cv.getBoundingClientRect();
  const cx = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
  const cy = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
  return {x: cx / r.width * W, y: cy / r.height * H};
}

function laneAt(y){
  const i = Math.floor((y - LANE_TOP) / LANE_H);
  return (i >= 0 && i < LANES) ? i : -1;
}

cv.addEventListener('mousemove', e => {
  if(G.phase !== 'playing'){ G.hoverLane = -1; return; }
  const p = evtPos(e);
  G.hoverLane = laneAt(p.y);
});
cv.addEventListener('mouseleave', () => { G.hoverLane = -1; });

cv.addEventListener('click', e => {
  if(G.phase !== 'playing') return;
  const p = evtPos(e);
  const lane = laneAt(p.y);
  if(lane >= 0) deploy(lane);
  if(!muted) bgmStart();
});

window.addEventListener('keydown', e => {
  if(e.key >= '1' && e.key <= '4'){
    if(G.phase === 'playing') selectSoldier(ORDER[parseInt(e.key, 10) - 1]);
    e.preventDefault();
  } else if(e.key === ' ' || e.key.toLowerCase() === 'p'){
    if(G.phase === 'playing') doPause();
    else if(G.phase === 'paused') doResume();
    e.preventDefault();
  } else if(e.key === 'Escape'){
    if(G.phase === 'playing') doPause();
    else if(G.phase === 'paused') doResume();
  }
});

function doPause(){
  if(G.phase !== 'playing') return;
  G.phase = 'paused';
  showOv('pause');
  bgmApplyGain();
  sfx('deploy');
}
function doResume(){
  if(G.phase !== 'paused') return;
  G.phase = 'playing';
  hideOv('pause');
  bgmApplyGain();
}

/* ------- 按钮 ------- */
document.getElementById('btnPause').addEventListener('click', doPause);
document.getElementById('btnResume').addEventListener('click', doResume);
document.getElementById('btnMute').addEventListener('click', function(){
  toggleMute();
  if(!muted) sfx('deploy');
});
document.getElementById('btnStart').addEventListener('click', () => {
  AC();
  bgmStart();
  const cleared = clearedList();
  let idx = 0;
  for(let i = 0; i < LEVELS.length; i++){
    if(cleared.indexOf(i) < 0){ idx = i; break; }
    idx = Math.min(i + 1, LEVELS.length - 1);
  }
  startLevel(idx);
});
document.getElementById('btnRetry').addEventListener('click', () => startLevel(G.lvIdx));
document.getElementById('btnNext').addEventListener('click', () => {
  const next = Math.min(G.lvIdx + 1, LEVELS.length - 1);
  startLevel(next);
});
document.getElementById('btnBack').addEventListener('click', () => {
  G.phase = 'menu';
  hideOv('result');
  showOv('menu');
  document.getElementById('bossbar').classList.remove('show');
});

/* ------- 每帧 UI 同步 ------- */
const hudCache = {hp:-1, en:-1, wave:-1, boss:-1};
function syncUI(){
  if(!G.level || G.phase === 'menu') return;
  const hp = Math.max(0, Math.round(G.baseHp));
  if(hp !== hudCache.hp){
    hudCache.hp = hp;
    document.getElementById('hpNum').textContent = hp;
    const pct = clamp(G.baseHp / G.baseMax * 100, 0, 100);
    const el = document.getElementById('hpFill');
    el.style.width = pct + '%';
    el.style.filter = pct < 35 ? 'saturate(1.6) brightness(1.05)' : '';
  }
  const en = Math.floor(G.energy);
  if(en !== hudCache.en){
    hudCache.en = en;
    document.getElementById('enNum').textContent = en;
    document.getElementById('enFill').style.width = clamp(en / 3, 0, 100) + '%';
  }
  if(G.waveNow !== hudCache.wave){
    hudCache.wave = G.waveNow;
    const pips = document.getElementById('pips');
    let html = '';
    for(let i = 0; i < G.waveTotal; i++)
      html += '<div class="pip' + (i < G.waveNow - 1 ? ' done' : '') + '"></div>';
    pips.innerHTML = html;
  }
  if(G.boss){
    const pct = Math.max(0, G.boss.hp / G.boss.maxHp * 100);
    if(Math.abs(pct - hudCache.boss) > 0.5){
      hudCache.boss = pct;
      document.getElementById('bossFill').style.width = pct + '%';
      document.getElementById('bossHpTxt').textContent = Math.ceil(pct) + '%';
    }
  }
  syncDock();
}

/* ------- 局间门禁：每玩 5 分钟答一题 ------- */
let gate = null;
function createGate(){
  if(!window.Gate) return;
  gate = window.Gate.create({
    everyMinutes: 5,
    challenges: ['quick-math', 'poem', 'english'],
    kicker: '局间门禁 · 钢铁防线',
    title: '先过一道关卡',
    note: '防线已经守了 5 分钟。答对这道题，才能接着打。',
    onLock: function(){
      G.gatePaused = true;
      bgmApplyGain();
    },
    onUnlock: function(){
      G.gatePaused = false;
      lastT = performance.now();
      bgmApplyGain();
    }
  });
}

/* ------- 主循环 ------- */
let lastT = performance.now();
function loop(now){
  const dt = Math.min(0.045, (now - lastT) / 1000);
  lastT = now;
  if(gate && gate.locked){ render(); syncUI(); requestAnimationFrame(loop); return; }
  update(dt);
  if(gate && G.phase === 'playing') gate.tick(dt);
  render();
  syncUI();
  requestAnimationFrame(loop);
}

/* ------- 启动 ------- */
fit();
document.body.classList.add('in-menu');
setMuted(true);
G.theme = THEMES.city;
G.baseMax = 1; G.baseHp = 1;
buildBackdrop('city');
initWeather('city');
buildLevelGrid();
buildDock();
createGate();
syncHUD();
requestAnimationFrame(loop);
</script>
