<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>钢铁防线 · 士兵打僵尸</title>

<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">

<link rel="stylesheet" href="../gate/gate.css">
<link rel="stylesheet" href="../gate/challenges.css">
<script src="../gate/gate.js"></script>
<script src="../poem/poem-data.js"></script>
<script src="../gate/challenges/quick-math.js"></script>
<script src="../gate/challenges/poem.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#05080b;font-family:"Noto Sans SC",-apple-system,"PingFang SC",sans-serif;color:#e9f1f5}
#stage{position:fixed;inset:0;display:grid;place-items:center;background:
  radial-gradient(ellipse at 50% 40%,#0c1219 0%,#05080b 70%)}
#frame{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:50% 50%;
  overflow:hidden;background:#070b10;
  box-shadow:0 0 0 1px rgba(255,181,69,.12),0 30px 90px rgba(0,0,0,.85)}
#cv{position:absolute;inset:0;width:1280px;height:720px;display:block;cursor:crosshair}
.num{font-family:"Barlow Condensed","Noto Sans SC",sans-serif;font-weight:600;font-variant-numeric:tabular-nums}
:root{
  --amber:#ffb545; --amber-soft:rgba(255,181,69,.18);
  --cyan:#7fe3ff; --red:#ff5c4d; --steel:#0e151b;
}

/* ========== 顶部 HUD ========== */
.hud{position:absolute;left:0;top:0;width:100%;height:118px;pointer-events:none;
  background:linear-gradient(180deg,rgba(5,9,13,.94) 0%,rgba(5,9,13,.72) 62%,rgba(5,9,13,0) 100%)}
.hud-lv{position:absolute;left:22px;top:14px;display:flex;align-items:center;gap:12px}
.lv-badge{width:52px;height:52px;border:1px solid rgba(255,181,69,.6);display:grid;place-items:center;
  font-family:"Barlow Condensed",sans-serif;font-size:30px;font-weight:700;color:var(--amber);
  background:linear-gradient(160deg,rgba(255,181,69,.16),rgba(255,181,69,.02));
  clip-path:polygon(0 0,100% 0,100% 74%,74% 100%,0 100%)}
.lv-meta .lv-name{font-size:20px;font-weight:700;letter-spacing:1px;line-height:1.15}
.lv-meta .lv-sub{font-size:11px;color:#7d94a2;letter-spacing:2.5px;margin-top:3px}
.pips{display:flex;gap:5px;margin-top:8px}
.pip{width:22px;height:4px;background:rgba(255,255,255,.13);transition:background .2s,box-shadow .2s}
.pip.done{background:var(--amber);box-shadow:0 0 8px rgba(255,181,69,.55)}

.hud-energy{position:absolute;left:50%;top:16px;transform:translateX(-50%);width:300px}
.en-row{display:flex;align-items:baseline;justify-content:center;gap:8px}
.en-num{font-size:38px;color:#fff;line-height:1;text-shadow:0 0 18px rgba(127,227,255,.45)}
.en-label{font-size:11px;letter-spacing:3px;color:#7fe3ff}
.en-bar{margin-top:8px;height:7px;background:rgba(255,255,255,.08);position:relative;overflow:hidden}
.en-fill{position:absolute;inset:0;width:0%;background:linear-gradient(90deg,#2b6f8a,#7fe3ff);
  box-shadow:0 0 14px rgba(127,227,255,.6);transition:width .12s linear}
.en-ticks{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 29px,rgba(0,0,0,.55) 29px 30px)}

.hud-right{position:absolute;right:22px;top:14px;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.hp-box{display:flex;align-items:center;gap:10px}
.hp-txt{font-size:12px;letter-spacing:2px;color:#a9bcc7}
.hp-txt b{font-family:"Barlow Condensed",sans-serif;font-size:22px;color:#fff;font-weight:700}
.hp-bar{width:180px;height:12px;background:rgba(255,255,255,.09);position:relative;overflow:hidden;
  clip-path:polygon(0 0,100% 0,96% 100%,0 100%)}
.hp-fill{position:absolute;inset:0;width:100%;background:linear-gradient(90deg,#ff5c4d,#ffb545);
  box-shadow:0 0 14px rgba(255,120,90,.5);transition:width .18s}
.btns{display:flex;gap:8px;pointer-events:auto}
.icon-btn{width:38px;height:32px;border:1px solid rgba(255,255,255,.16);background:rgba(14,21,27,.85);
  color:#c3d3dd;cursor:pointer;display:grid;place-items:center;font-size:15px;transition:.15s}
.icon-btn:hover{border-color:var(--amber);color:var(--amber)}
.icon-btn.on{border-color:var(--amber);color:var(--amber);background:rgba(255,181,69,.12)}

/* ========== 底部士兵栏 ========== */
.dock{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:12px;align-items:flex-end}
.card{position:relative;width:154px;height:98px;border:1px solid rgba(140,165,180,.28);
  background:linear-gradient(180deg,rgba(20,29,37,.96),rgba(8,12,16,.97));
  cursor:pointer;padding:10px 10px 8px;overflow:hidden;transition:transform .12s,border-color .15s,box-shadow .15s}
.card:before{content:"";position:absolute;left:0;top:0;width:3px;height:100%;background:var(--ac);opacity:.55}
.card:hover{transform:translateY(-4px);border-color:rgba(255,181,69,.6)}
.card.sel{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber),0 0 26px rgba(255,181,69,.28);transform:translateY(-6px)}
.card.no{opacity:.42;cursor:not-allowed;filter:saturate(.35)}
.card-top{display:flex;align-items:center;gap:8px}
.card-ico{width:44px;height:44px;flex:0 0 44px;display:grid;place-items:center;
  border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03)}
.card-name{font-size:14px;font-weight:700;line-height:1.1;letter-spacing:.5px}
.card-en{font-family:"Barlow Condensed",sans-serif;font-size:10px;letter-spacing:1.8px;color:#7d94a2;margin-top:2px}
.card-desc{font-size:10.5px;color:#93a8b4;line-height:1.35;margin-top:7px;height:28px;overflow:hidden}
.cost{position:absolute;right:8px;bottom:7px;font-family:"Barlow Condensed",sans-serif;
  font-size:19px;font-weight:700;color:var(--cyan);display:flex;align-items:center;gap:3px}
.cost svg{width:12px;height:12px;opacity:.85}
.card-key{position:absolute;left:10px;bottom:8px;font-family:"Barlow Condensed",sans-serif;font-size:11px;
  color:#5d7280;letter-spacing:1px}
.hint{position:absolute;left:50%;bottom:124px;transform:translateX(-50%);font-size:12px;color:#8ba0ad;
  letter-spacing:1px;white-space:nowrap;transition:opacity .4s;pointer-events:none}
.hint b{color:var(--amber)}

/* ========== BOSS 血条 ========== */
.bossbar{position:absolute;left:50%;top:96px;transform:translateX(-50%);width:520px;opacity:0;transition:opacity .3s;pointer-events:none}
.bossbar.show{opacity:1}
.bossbar .bs-label{display:flex;justify-content:space-between;font-size:11px;letter-spacing:2px;color:#ff8a76;margin-bottom:5px}
.bossbar .bs-track{height:10px;background:rgba(0,0,0,.6);border:1px solid rgba(255,92,77,.45);position:relative;overflow:hidden}
.bossbar .bs-fill{position:absolute;inset:0;width:100%;background:linear-gradient(90deg,#7a1020,#ff5c4d,#ffb545);box-shadow:0 0 18px rgba(255,92,77,.6)}

/* ========== 遮罩面板 ========== */
.overlay{position:absolute;inset:0;display:none;place-items:center;z-index:5;
  background:radial-gradient(ellipse at 50% 45%,rgba(6,10,14,.82),rgba(3,5,8,.97))}
.overlay.show{display:grid}
.panel{width:1000px;max-width:94%;padding:34px 38px 30px;position:relative;
  background:linear-gradient(180deg,rgba(13,20,26,.96),rgba(7,11,15,.97));
  border:1px solid rgba(255,181,69,.22);
  box-shadow:0 0 0 1px rgba(0,0,0,.6),0 0 80px rgba(0,0,0,.8) inset}
.panel:before,.panel:after{content:"";position:absolute;width:54px;height:54px;border:1px solid rgba(255,181,69,.55)}
.panel:before{left:-1px;top:-1px;border-right:0;border-bottom:0}
.panel:after{right:-1px;bottom:-1px;border-left:0;border-top:0}
.p-title{font-size:34px;font-weight:700;letter-spacing:6px;line-height:1.1}
.p-title .thin{font-weight:400;letter-spacing:2px;color:#8ea4b1;font-size:15px;display:block;margin-top:8px}
.p-rule{height:1px;background:linear-gradient(90deg,rgba(255,181,69,.6),rgba(255,181,69,0));margin:18px 0 22px}

.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.lcard{position:relative;height:170px;border:1px solid rgba(150,170,185,.22);cursor:pointer;overflow:hidden;
  background:#0a0f14;transition:transform .15s,border-color .15s,box-shadow .15s}
.lcard:hover{transform:translateY(-5px);border-color:var(--amber);box-shadow:0 10px 28px rgba(0,0,0,.6)}
.lcard .lc-bg{position:absolute;inset:0;opacity:.75}
.lcard .lc-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(2,5,8,.55),rgba(2,5,8,.12) 34%,rgba(2,5,8,.9) 78%)}
.lcard .lc-idx{position:absolute;left:8px;top:8px;font-family:"Barlow Condensed",sans-serif;font-size:12px;padding:1px 6px;
  background:rgba(4,8,12,.62);border:1px solid rgba(150,170,185,.25);
  letter-spacing:2px;color:rgba(255,255,255,.55)}
.lcard .lc-name{position:absolute;left:12px;right:12px;bottom:40px;font-size:18px;font-weight:700;line-height:1.15;letter-spacing:.5px;
  text-shadow:0 2px 10px rgba(0,0,0,.95)}
.lcard .lc-sub{position:absolute;left:12px;right:12px;bottom:18px;font-size:10px;letter-spacing:1.2px;color:#a8bcc7;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 4px rgba(0,0,0,.9)}
.lcard .lc-pv{position:absolute;inset:0;width:100%;height:100%}
body.in-menu .hud{opacity:0;pointer-events:none}
body.in-menu .dock{opacity:0;pointer-events:none}
#hud,.dock,.hud{transition:opacity .35s ease}
body.in-menu #hint{opacity:0}
.lcard .lc-clear{position:absolute;right:10px;top:8px;font-size:10px;letter-spacing:1px;color:var(--amber);
  border:1px solid rgba(255,181,69,.5);padding:2px 6px}
.lcard.boss .lc-name{color:#ffb3a0;text-shadow:0 0 14px rgba(255,70,40,.55),0 2px 10px #000}

.p-foot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:24px;gap:20px}
.tips{font-size:12px;color:#8298a5;line-height:1.9;letter-spacing:.5px}
.tips span{color:var(--amber)}
.btn{font-family:"Noto Sans SC",sans-serif;font-size:15px;letter-spacing:3px;font-weight:700;
  padding:13px 30px;border:1px solid rgba(255,181,69,.65);color:var(--amber);
  background:linear-gradient(180deg,rgba(255,181,69,.16),rgba(255,181,69,.04));cursor:pointer;transition:.15s}
.btn:hover{background:rgba(255,181,69,.24);box-shadow:0 0 22px rgba(255,181,69,.3)}
.btn.ghost{border-color:rgba(150,170,185,.4);color:#bdccd5;background:rgba(255,255,255,.03)}
.btn.ghost:hover{border-color:#9fb4c0;box-shadow:none}

.result{display:none}
.result.show{display:block}
.res-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:rgba(255,255,255,.1);margin:6px 0 24px}
.res-cell{background:#0a1015;padding:16px 14px}
.res-cell .k{font-size:10.5px;letter-spacing:2px;color:#8298a5}
.res-cell .v{font-family:"Barlow Condensed",sans-serif;font-size:30px;font-weight:700;color:#fff;margin-top:6px;line-height:1}

.toast{position:absolute;left:50%;top:140px;transform:translateX(-50%);padding:8px 20px;
  background:rgba(255,92,77,.14);border:1px solid rgba(255,92,77,.55);color:#ffb3a8;font-size:13px;
  letter-spacing:2px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
</style>
</head>
<body>
<div id="stage">
 <div id="frame">
  <canvas id="cv"></canvas>

  <!-- ===== HUD ===== -->
  <div class="hud">
    <div class="hud-lv">
      <div class="lv-badge num" id="lvNum">1</div>
      <div class="lv-meta">
        <div class="lv-name" id="lvName">城市废墟</div>
        <div class="lv-sub" id="lvSub">NIGHT CITY / SECTOR 01</div>
        <div class="pips" id="pips"></div>
      </div>
    </div>

    <div class="hud-energy">
      <div class="en-row"><span class="en-num num" id="enNum">0</span><span class="en-label">ENERGY</span></div>
      <div class="en-bar"><div class="en-fill" id="enFill"></div><div class="en-ticks"></div></div>
    </div>

    <div class="hud-right">
      <div class="hp-box">
        <span class="hp-txt">基地护盾 <b class="num" id="hpNum">120</b></span>
        <div class="hp-bar"><div class="hp-fill" id="hpFill"></div></div>
      </div>
      <div class="btns">
        <button class="icon-btn" id="btnPause" title="暂停"><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="3" width="4.6" height="18"/><rect x="14.4" y="3" width="4.6" height="18"/></svg></button>
        <button class="icon-btn" id="btnMute" title="音效 / 背景音乐"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h3l5 4V5L7 9z"/><path d="M16 9.5a4 4 0 0 1 0 5"/><path d="M18.5 7a7.5 7.5 0 0 1 0 10"/></svg></button>
      </div>
    </div>

    <div class="bossbar" id="bossbar">
      <div class="bs-label"><span>尸王 · ABOMINATION</span><span class="num" id="bossHpTxt">0%</span></div>
      <div class="bs-track"><div class="bs-fill" id="bossFill"></div></div>
    </div>
    <div class="toast" id="toast">基地护盾受损！</div>
  </div>

  <!-- ===== 士兵栏 ===== -->
  <div class="dock" id="dock"></div>
  <div class="hint" id="hint">选一个士兵 → 点击赛道投放，士兵自动开火</div>

  <!-- ===== 标题 / 选关 ===== -->
  <div class="overlay show" id="menu">
    <div class="panel">
      <div class="p-title">钢铁防线<span class="thin">SOLDIERS VS ZOMBIES · 五个战场，一条防线</span></div>
      <div class="p-rule"></div>
      <div class="levels" id="levelGrid"></div>
      <div class="p-foot">
        <div class="tips">
          点击底栏士兵 → 点击任意赛道投放，能量自动回充<br>
          <span>手枪兵</span>便宜灵活 · <span>加特林兵</span>弹幕清小不点 · <span>重甲兵</span>肉墙抗线 · <span>坦克兵</span>炮弹溅射
        </div>
        <button class="btn" id="btnStart">进入战场</button>
      </div>
    </div>
  </div>

  <!-- ===== 结算 ===== -->
  <div class="overlay" id="result">
    <div class="panel">
      <div class="p-title" id="resTitle">防线守住了<span class="thin" id="resSub">SECTOR CLEARED</span></div>
      <div class="p-rule"></div>
      <div class="res-stats">
        <div class="res-cell"><div class="k">击杀</div><div class="v num" id="resKills">0</div></div>
        <div class="res-cell"><div class="k">得分</div><div class="v num" id="resScore">0</div></div>
        <div class="res-cell"><div class="k">存活士兵</div><div class="v num" id="resAlive">0</div></div>
        <div class="res-cell"><div class="k">护盾剩余</div><div class="v num" id="resHp">0</div></div>
      </div>
      <div class="p-foot">
        <div class="tips" id="resTips"></div>
        <div style="display:flex;gap:12px">
          <button class="btn ghost" id="btnRetry">重打本关</button>
          <button class="btn ghost" id="btnBack">选择关卡</button>
          <button class="btn" id="btnNext">下一关</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== 暂停 ===== -->
  <div class="overlay" id="pause">
    <div class="panel" style="width:520px;text-align:center">
      <div class="p-title" style="font-size:26px">暂停<span class="thin">PAUSED</span></div>
      <div class="p-rule"></div>
      <button class="btn" id="btnResume" style="margin:0 auto">继续战斗</button>
    </div>
  </div>
 </div>
</div>

<script>
/* =========================================================
   钢铁防线 · 士兵打僵尸
   ========================================================= */
const W = 1280, H = 720;
const LANES = 5, LANE_TOP = 150, LANE_H = 92;
const BASE_X = 152;            // 僵尸走到这里开始打基地
const SPAWN_X = 1195;          // 僵尸出生点（画面右端）
const SLOTS = [182, 268, 354, 440]; // 每条赛道的四个投放位（纵深四排）
const LANE_Y = Array.from({length: LANES}, (_, i) => LANE_TOP + LANE_H * i + LANE_H / 2);

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const DPR = Math.min(2, window.devicePixelRatio || 1);
cv.width = W * DPR; cv.height = H * DPR;
ctx.scale(DPR, DPR);

/* ---------------- 士兵数据 ---------------- */
const SOLDIERS = {
  pistol: {key:'pistol', name:'手枪兵', en:'PISTOL', cost:30, hp:95, rate:0.34, dmg:12, range:620,
           accent:'#7fe3ff', desc:'便宜灵活，前中期主力'},
  gatling:{key:'gatling', name:'加特林兵', en:'GATLING', cost:110, hp:130, rate:0.05, dmg:9, range:650,
           accent:'#ffb845', desc:'高射速弹幕，专清小不点'},
  heavy:  {key:'heavy', name:'重甲兵', en:'HEAVY', cost:150, hp:640, rate:0.60, dmg:30, pellets:4, range:400,
           accent:'#ff7a5c', desc:'霰弹近防，肉墙抗线'},
  tank:   {key:'tank', name:'坦克兵', en:'TANK', cost:240, hp:820, rate:1.7, dmg:115, range:700, splash:150,
           accent:'#ffd166', desc:'炮弹溅射，成片杀伤'}
};
const ORDER = ['pistol','gatling','heavy','tank'];

/* ---------------- 僵尸数据 ---------------- */
const ZOMBIES = {
  tiny:  {name:'小不点', hp:88,  speed:80, dps:11,  size:0.72, score:15, color:'#4e6f42'},
  walker:{name:'普通僵尸', hp:215, speed:62, dps:20, size:1.0,  score:25, color:'#43603c'},
  runner:{name:'疾走僵尸', hp:155, speed:138, dps:16, size:0.98, score:30, color:'#5b7245'},
  armor: {name:'重甲僵尸', hp:620, speed:48, dps:30, size:1.2,  score:60, color:'#3a5040'},
  boss:  {name:'尸王', hp:5200, speed:40, dps:60, size:2.30, score:500, color:'#5a3a4a'}
};

/* ---------------- 场景主题 ---------------- */
const THEMES = {
  city:      {sky:['#0a1420','#182b3d','#2b4459'], ground:['#1a232b','#0b1015'], accent:'#ffb545',
              neon:['#ff5fa2','#5ff0ff','#ffd166'], weather:'rain', name:'夜雨霓虹'},
  desert:    {sky:['#3a2417','#6d4726','#b07a3c'], ground:['#33241a','#170f0a'], accent:'#ffcf74',
              neon:['#ff9a3c','#ffd166'], weather:'dust', name:'沙暴公路'},
  snow:      {sky:['#0d1a28','#22405c','#5d809f'], ground:['#28394a','#131b25'], accent:'#bfe9ff',
              neon:['#9fe4ff','#dff3ff'], weather:'snow', name:'极寒雪原'},
  factory:   {sky:['#0e1712','#193022','#2f4a2c'], ground:['#1c2418','#0c100a'], accent:'#a6ff6b',
              neon:['#a6ff6b','#ffd166'], weather:'toxic', name:'生化工厂'},
  fortress:  {sky:['#1c0a11','#3b1320','#6b1e28'], ground:['#231016','#0e0609'], accent:'#ff7a4d',
              neon:['#ff5c4d','#ffb545'], weather:'ember', name:'极夜要塞'}
};

/* ---------------- 关卡（场景即关卡） ---------------- */
const LEVELS = [
  { id:1, name:'城市废墟', theme:'city', tag:'SECTOR 01', energy:180, rate:16, baseHp:130,
    waves:[
      {gap:8, groups:[{type:'tiny', count:10, span:10}]},

  weather:[], uid:1, hoverLane:-1, time:0

const rand  = (a, b) => a + Math.random() * (b - a);
const randi = n => Math.floor(Math.random() * n);
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const dist  = (a, b) => Math.abs(a - b);

/* =========================================================
   音效（默认静音，点击按钮后开启）
   ========================================================= */
let actx = null, muted = true;
function AC(){
  if(!actx){
    try{ actx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ actx = null; }
  }
  return actx;
}
function sfx(kind){
  if(muted) return;
  const a = AC(); if(!a) return;
  const t = a.currentTime;
  if(kind === 'pistol' || kind === 'gatling' || kind === 'heavy'){
    const o = a.createOscillator(), g = a.createGain();
    o.type = 'square';
    o.frequency.setValueAtTime(kind === 'heavy' ? 180 : 320, t);
    o.frequency.exponentialRampToValueAtTime(70, t + 0.07);
    g.gain.setValueAtTime(kind === 'gatling' ? 0.045 : 0.07, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + 0.09);
  } else if(kind === 'boom'){
    const buf = a.createBuffer(1, a.sampleRate * 0.28, a.sampleRate);
    const d = buf.getChannelData(0);
    for(let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2);
    const src = a.createBufferSource(), g = a.createGain();
    src.buffer = buf; g.gain.value = 0.22;
    src.connect(g).connect(a.destination); src.start(t);
  } else if(kind === 'deploy'){
    const o = a.createOscillator(), g = a.createGain();
    o.type = 'triangle'; o.frequency.setValueAtTime(260, t);
    o.frequency.exponentialRampToValueAtTime(560, t + 0.12);
    g.gain.setValueAtTime(0.1, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + 0.19);
  } else if(kind === 'die'){
    const o = a.createOscillator(), g = a.createGain();
    o.type = 'sawtooth'; o.frequency.setValueAtTime(140, t);
    o.frequency.exponentialRampToValueAtTime(48, t + 0.2);
    g.gain.setValueAtTime(0.06, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.24);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + 0.25);
  } else if(kind === 'win' || kind === 'lose'){
    const seq = kind === 'win' ? [523, 659, 784, 1046] : [330, 262, 196];
    seq.forEach((f, i) => {
      const o = a.createOscillator(), g = a.createGain();
      o.type = 'triangle'; o.frequency.value = f;
      const st = t + i * 0.16;
      g.gain.setValueAtTime(0.001, st); g.gain.linearRampToValueAtTime(0.12, st + 0.03);
      g.gain.exponentialRampToValueAtTime(0.001, st + 0.30);
      o.connect(g).connect(a.destination); o.start(st); o.stop(st + 0.31);
    });
  }
}


/* =========================================================
   背景音乐：WebAudio 程序化军乐循环（无需外部音频文件）
   ========================================================= */
const BGM = { step:0, nextT:0, timer:null, bpm:92, baseBpm:92, theme:'city', boss:false, master:null, noise:null };
let manualMute = null;

const BGM_SCALES = {
  city:     [0, 3, 5, 7, 10],
  desert:   [0, 2, 5, 7, 9],
  snow:     [0, 2, 3, 7, 8],
  factory:  [0, 1, 4, 6, 7],
  fortress: [0, 1, 3, 6, 8]
};

function bgmNoiseBuffer(a){
  if(!BGM.noise){
    const n = Math.floor(a.sampleRate * 0.5);
    const buf = a.createBuffer(1, n, a.sampleRate);
    const d = buf.getChannelData(0);
    for(let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    BGM.noise = buf;
  }
  return BGM.noise;
}

function bgmMaster(a){
  if(!BGM.master){
    const g = a.createGain();
    g.gain.value = 0;
    let node = g;
    try{
      const comp = a.createDynamicsCompressor();
      comp.threshold.value = -12; comp.knee.value = 12;
      comp.ratio.value = 4; comp.attack.value = 0.01; comp.release.value = 0.25;
      g.connect(comp); node = comp;
    }catch(e){}
    node.connect(a.destination);
    BGM.master = g;
  }
  return BGM.master;
}

function bgmTone(a, type, freq, t, dur, vol){
  const o = a.createOscillator(), g = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(bgmMaster(a));
  o.start(t); o.stop(t + dur + 0.03);
}

function bgmHit(a, t, vol, freq, dur){
  const src = a.createBufferSource(), g = a.createGain(), f = a.createBiquadFilter();
  src.buffer = bgmNoiseBuffer(a);
  f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 1.15;
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(f).connect(g).connect(bgmMaster(a));
  src.start(t); src.stop(t + dur + 0.02);
}

function bgmStepPlay(step, t){
  const a = actx; if(!a) return;
  const dt = 60 / BGM.bpm / 2;
  const s = step % 16, bar = Math.floor(step / 16);
  const sc = BGM_SCALES[BGM.theme] || BGM_SCALES.city;
  const root = 110;
  const hz = n => root * Math.pow(2, n / 12);

  // 鼓组：底鼓、军鼓、踩镲
  if(s === 0 || s === 8) bgmHit(a, t, BGM.boss ? 1.05 : 0.85, 90, 0.17);
  if(s === 4 || s === 12) bgmHit(a, t, 0.32, 320, 0.10);
  if(s % 2 === 1) bgmHit(a, t, 0.1, 1500, 0.045);
  if(BGM.boss && (s === 2 || s === 10 || s === 14)) bgmHit(a, t, 0.2, 210, 0.1);

  // 低音行进
  if(s % 4 === 0){
    const bassSeq = [0, 7, 0, sc[2] || 4];
    const n = bassSeq[(s / 4 + bar) % 4];
    bgmTone(a, 'sawtooth', hz(n), t, dt * 1.6, 0.22);
  }

  // 铜管和声：每两小节垫一次
  if(s === 0 && bar % 2 === 0){
    bgmTone(a, 'triangle', hz(sc[1]), t, dt * 6, 0.11);
    bgmTone(a, 'triangle', hz(sc[3]), t, dt * 6, 0.085);
  }

  // 动机旋律
  if(bar % 4 === 1 && (s === 2 || s === 6 || s === 10)){
    bgmTone(a, 'square', hz(sc[(s / 2 + bar) % sc.length] + 12), t, 0.16, 0.09);
  }

  // BOSS 段：急促警报
  if(BGM.boss && bar % 2 === 1 && s === 12){
    bgmTone(a, 'sawtooth', hz(sc[4] + 19), t, 0.28, 0.1);
  }
}

function bgmTick(){
  const a = actx;
  if(!a || muted){ BGM.timer = null; return; }
  const dt = 60 / BGM.bpm / 2;
  if(!BGM.nextT) BGM.nextT = a.currentTime + 0.08;
  let guard = 0;
  while(BGM.nextT < a.currentTime + 0.32 && guard++ < 32){
    bgmStepPlay(BGM.step++, BGM.nextT);
    BGM.nextT += dt;
  }
  BGM.timer = setTimeout(bgmTick, 160);
}

function bgmApplyGain(){
  const a = actx;
  if(!a || !BGM.master) return;
  const v = muted ? 0 : ((G.phase === 'paused' || G.gatePaused) ? 0.4 : 1);
  BGM.master.gain.setTargetAtTime(v, a.currentTime, 0.28);
}

function bgmStart(){
  const a = AC(); if(!a) return;
  bgmMaster(a);
  if(a.state === 'suspended'){ try{ a.resume(); }catch(e){} }
  bgmApplyGain();
  if(muted) return;
  if(!BGM.timer){ BGM.nextT = 0; bgmTick(); }
}

function bgmStop(){
  if(BGM.timer){ clearTimeout(BGM.timer); BGM.timer = null; }
  BGM.nextT = 0;
}

function bgmTheme(idx){
  BGM.theme = ['city', 'desert', 'snow', 'factory', 'fortress'][idx] || 'city';
  BGM.baseBpm = 92 + idx * 5;
  BGM.bpm = BGM.baseBpm;
  BGM.boss = false;
}

function bgmBoss(on){
  BGM.boss = on;
  BGM.bpm = on ? BGM.baseBpm + 34 : BGM.baseBpm;
}

function setMuted(m){
  muted = m;
  const b = document.getElementById('btnMute');
  if(b){ b.classList.toggle('on', !m); b.style.opacity = m ? '0.55' : '1'; }
  bgmApplyGain();
  if(m) bgmStop(); else bgmStart();
}

function toggleMute(){
  manualMute = !muted;
  setMuted(manualMute);
}

function autoSound(){
  if(muted && manualMute === null) setMuted(false);
}

/* =========================================================
   关卡与波次
   ========================================================= */
function buildSchedule(lv){
  const ev = []; let t = 3.2;
  lv.waves.forEach((w, wi) => {
    let end = 0;
    w.groups.forEach(g => {
      const step = g.count > 1 ? g.span / (g.count - 1) : 0;
      for(let i = 0; i < g.count; i++){
        const at = t + i * step + (i === 0 ? 0 : rand(-0.3, 0.3));
        const fixed = (g.lane === 'rand') ? randi(LANES) : g.lane;
        const lane = (fixed === undefined || fixed === null) ? randi(LANES) : fixed;
        ev.push({t:Math.max(t + 0.4, at), type:g.type, lane, wave:wi, focus:!!g.focus});
        end = Math.max(end, at - t);
      }
    });
    t += end + (w.gap || 8);
  });
  ev.sort((a, b) => a.t - b.t);
  return ev;
}

function startLevel(idx){
  const lv = LEVELS[idx];
  G.lvIdx = idx; G.level = lv; G.theme = THEMES[lv.theme];
  G.phase = 'playing';
  G.t = 0; G.time = 0;
  G.energy = lv.energy; G.baseHp = lv.baseHp; G.baseMax = lv.baseHp;
  G.soldiers = []; G.zombies = []; G.bullets = []; G.parts = [];
  G.queue = buildSchedule(lv); G.qi = 0;
  G.kills = 0; G.score = 0; G.sel = null; G.boss = null;
  G.shake = 0; G.flash = 0; G.whiteFlash = 0;
  G.waveTotal = lv.waves.length; G.waveNow = 1;
  G.winTimer = 0; G.loseTimer = 0; G.hoverLane = -1;
  buildBackdrop(lv.theme);
  initWeather(lv.theme);
  buildDock();
  syncHUD();
  hideOv('menu'); hideOv('result'); hideOv('pause');
  document.getElementById('bossbar').classList.remove('show');
  document.getElementById('hint').style.opacity = 1;
  setTimeout(() => { const h = document.getElementById('hint'); if(h) h.style.opacity = 0; }, 9000);
  bgmTheme(G.lvIdx);
  autoSound();
  bgmStart();
}

/* =========================================================
   投放士兵
   ========================================================= */
function deploy(lane){
  if(G.phase !== 'playing') return;
  if(G.sel === null){ toast('先在下面选一个士兵'); return; }
  const def = SOLDIERS[G.sel];
  if(G.energy < def.cost){ toast('能量不够，等一等'); return; }

  const used = G.soldiers.filter(s => s.lane === lane).map(s => s.slot);
  let slot = -1;
  for(let i = 0; i < SLOTS.length; i++){ if(used.indexOf(i) < 0){ slot = i; break; } }
  if(slot < 0){ toast('这条赛道已经满了'); return; }

  G.energy -= def.cost;
  const s = {
    id:G.uid++, key:def.key, def, lane, slot,
    x:SLOTS[slot], y:LANE_Y[lane],
    hp:def.hp, maxHp:def.hp, cd:0.15, spin:0, recoil:0, flash:0, born:0.6
  };
  G.soldiers.push(s);
  ringParticles(s.x, s.y);
  sfx('deploy');
  syncHUD();
}

/* =========================================================
   僵尸
   ========================================================= */
function spawnZombie(ev){
  const def = ZOMBIES[ev.type];
  const isBoss = ev.type === 'boss';
  if(isBoss) ev.lane = 2;   // 尸王只走中路，避免顶到 HUD
  const z = {
    id:G.uid++, key:ev.type, def, lane:ev.lane,
    x:SPAWN_X + rand(0, 40), y:LANE_Y[ev.lane],
    hp:def.hp, maxHp:def.hp, size:def.size,
    speed:def.speed * (isBoss ? 1 : 1),
    flash:0, walk:rand(0, 6.28), moving:true, dead:false,
    isBoss
  };
  G.zombies.push(z);
  // 出怪爆闪：营造“外面”撕开裂口的动势
  for(let i = 0; i < 6; i++)
    addPart({type:'spark', x:SPAWN_X + rand(-8, 20), y:LANE_Y[ev.lane] + rand(-26, 26),
             vx:rand(-320, -80), vy:rand(-60, 60), g:0,
             life:rand(0.18, 0.4), maxLife:0.4, size:rand(1.2, 3.2),
             color: isBoss ? '#ff9a5a' : '#ff5a48'});
  if(isBoss){
    G.boss = z;
    document.getElementById('bossbar').classList.add('show');
    G.shake = 12;
    toast('尸王出现了！');
    bgmBoss(true);
  }
}

/* =========================================================
   伤害与特效
   ========================================================= */
function damageZ(z, dmg){
  if(z.dead || z.hp <= 0) return;
  z.hp -= dmg;
  z.flash = 1;
  addPart({type:'text', x:z.x + rand(-8, 8), y:z.y - z.size * 40 - 14, vy:-46, life:0.7,
           maxLife:0.7, text:Math.round(dmg), color:dmg >= 60 ? '#ffd166' : '#ffffff', size:15});
  if(z.hp <= 0) killZ(z);
}

function killZ(z){
  if(z.dead) return;
  z.dead = true;
  G.kills++;
  G.score += z.def.score;
  const n = z.isBoss ? 44 : 9;
  for(let i = 0; i < n; i++){
    addPart({type:'goo', x:z.x + rand(-10, 10), y:z.y - rand(4, 30), vx:rand(-150, 90), vy:rand(-190, -40),
             g:340, life:rand(0.42, 0.9), maxLife:0.9, size:rand(2, 5), color:'#7da35a'});
  }
  addPart({type:'ring', x:z.x, y:z.y - 20, life:0.4, maxLife:0.4, size:z.isBoss ? 160 : 34, color:'#c9f5a0'});
  if(z.isBoss){
    G.boss = null;
    G.whiteFlash = 1; G.shake = 26; G.flash = 1;
    document.getElementById('bossbar').classList.remove('show');
    addPart({type:'ring', x:z.x, y:z.y - 40, life:0.9, maxLife:0.9, size:420, color:'#ff7a4d'});
    toast('尸王被击倒！');
    bgmBoss(false);
    sfx('boom');
  } else {
    sfx('die');
  }
  syncHUD();
}

function explode(x, lane, dmg, r){
  for(const z of G.zombies){
    if(z.dead || z.lane !== lane) continue;
    if(dist(z.x, x) <= r) damageZ(z, dmg * (dist(z.x, x) < r * 0.45 ? 1.25 : 0.85));
  }
  for(let i = 0; i < 22; i++){
    addPart({type:'spark', x:x + rand(-14, 14), y:LANE_Y[lane] + rand(-20, 10),
             vx:rand(-240, 240), vy:rand(-260, 60), g:420, life:rand(0.2, 0.6), maxLife:0.6, size:rand(1.5, 4), color:'#ffb545'});
  }
  addPart({type:'ring', x, y:LANE_Y[lane] - 10, life:0.45, maxLife:0.45, size:r * 1.5, color:'#ffd166'});
  addPart({type:'smoke', x, y:LANE_Y[lane] - 12, vx:0, vy:-20, life:0.8, maxLife:0.8, size:r * 0.5, color:'rgba(60,55,50,0.7)'});
  G.shake = Math.max(G.shake, 9);
  sfx('boom');
}

/* =========================================================
   粒子
   ========================================================= */
function addPart(p){
  p.vx = p.vx || 0; p.vy = p.vy || 0; p.g = p.g || 0;
  G.parts.push(p);
  if(G.parts.length > 460) G.parts.splice(0, G.parts.length - 460);
}

function ringParticles(x, y){
  addPart({type:'ring', x, y, life:0.5, maxLife:0.5, size:70, color:'#7fe3ff'});
  for(let i = 0; i < 12; i++){
    const a = (i / 12) * Math.PI * 2;
    addPart({type:'spark', x, y, vx:Math.cos(a) * 110, vy:Math.sin(a) * 60, g:0,
             life:0.45, maxLife:0.45, size:2.5, color:'#7fe3ff'});
  }
}

/* =========================================================
   士兵开火
   ========================================================= */
function fire(s){
  const def = s.def;
  const mx = s.x + 26, my = s.y - (def.key === 'tank' ? 14 : 10);
  if(def.key === 'pistol'){
    G.bullets.push({lane:s.lane, x:mx, y:my, vx:820, vy:0, dmg:def.dmg, life:1.4, type:'tracer'});
    muzzle(mx, my, 7, '#7fe3ff');
    sfx('pistol');
  } else if(def.key === 'gatling'){
    G.bullets.push({lane:s.lane, x:mx, y:my + rand(-5, 5), vx:900, vy:rand(-8, 8),
                    dmg:def.dmg, life:1.2, type:'gatling'});
    muzzle(mx, my, 9, '#ffb845');
    if(Math.random() < 0.35) sfx('gatling');
  } else if(def.key === 'heavy'){
    for(let i = 0; i < def.pellets; i++){
      G.bullets.push({lane:s.lane, x:mx, y:my + rand(-4, 4), vx:rand(760, 900),
                      vy:rand(-70, 70), dmg:def.dmg, life:0.55, type:'pellet'});
    }
    muzzle(mx, my, 13, '#ff7a5c');
    s.recoil = 1.2;
    sfx('heavy');
  } else if(def.key === 'tank'){
    G.bullets.push({lane:s.lane, x:mx + 6, y:my, vx:520, vy:0, dmg:def.dmg,
                    life:2.6, type:'shell', splash:def.splash});
    muzzle(mx + 6, my, 18, '#ffd166');
    s.recoil = 2;
    G.shake = Math.max(G.shake, 4);
    sfx('heavy');
  }
}

function muzzle(x, y, r, color){
  addPart({type:'flash', x, y, life:0.09, maxLife:0.09, size:r, color});
  for(let i = 0; i < 3; i++)
    addPart({type:'spark', x, y, vx:rand(60, 260), vy:rand(-40, 40), g:0,
             life:rand(0.08, 0.2), maxLife:0.2, size:rand(1, 2.5), color});
}

/* =========================================================
   更新主逻辑
   ========================================================= */
function update(dt){
  G.time += dt;
  if(G.phase !== 'playing'){
    updateParts(dt);
    updateWeather(dt);
    return;
  }
  G.t += dt;
  G.energy = Math.min(999, G.energy + G.level.rate * dt);
  G.shake = Math.max(0, G.shake - dt * 46);
  G.flash = Math.max(0, G.flash - dt * 1.8);
  G.whiteFlash = Math.max(0, G.whiteFlash - dt * 2.4);

  // 出怪
  while(G.qi < G.queue.length && G.queue[G.qi].t <= G.t){
    spawnZombie(G.queue[G.qi]);
    G.qi++;
  }
  G.waveNow = Math.min(G.waveTotal, (G.queue[Math.min(G.qi, G.queue.length - 1)] || {wave:0}).wave + 1);

  updateSoldiers(dt);
  updateBullets(dt);
  updateZombies(dt);
  updateParts(dt);
  updateWeather(dt);

  G.zombies = G.zombies.filter(z => !z.dead);
  G.bullets = G.bullets.filter(b => !b.dead);
  G.soldiers = G.soldiers.filter(s => s.hp > 0);
  if(G.boss && G.boss.dead) G.boss = null;

  // 输赢判定
  if(G.baseHp <= 0 && G.phase === 'playing'){
    G.baseHp = 0;
    G.loseTimer += dt;
    if(G.loseTimer > 0.9) endGame(false);
  } else if(G.qi >= G.queue.length && G.zombies.length === 0 && !G.boss){
    G.winTimer += dt;
    if(G.winTimer > 1.1) endGame(true);
  }
}

function updateSoldiers(dt){
  for(const s of G.soldiers){
    s.cd -= dt;
    s.recoil = Math.max(0, s.recoil - dt * 6);
    s.flash = Math.max(0, s.flash - dt * 4);
    s.born = Math.max(0, s.born - dt);
    if(s.key === 'gatling') s.spin *= Math.exp(-6 * dt);

    // 找目标：同赛道、射程内、最靠前（最接近基地）
    let target = null;
    for(const z of G.zombies){
      if(z.dead || z.lane !== s.lane) continue;
      if(z.x < s.x - 16) continue;
      if(z.x > s.x + s.def.range) continue;
      if(!target || z.x < target.x) target = z;
    }
    s.aiming = !!target;
    if(target && s.cd <= 0){
      fire(s);
      s.cd = s.def.rate;
      if(s.key === 'gatling') s.spin = Math.min(10, s.spin + 2.2);
      s.flash = 1;
    }
  }
}

function updateBullets(dt){
  for(const b of G.bullets){
    b.life -= dt;
    const px = b.x;
    b.x += b.vx * dt;
    if(b.vy) b.y += b.vy * dt;
    if(b.x > W + 60 || b.life <= 0){ b.dead = true; continue; }
    const lo = Math.min(px, b.x), hi = Math.max(px, b.x);

    for(const z of G.zombies){
      if(z.dead || z.lane !== b.lane) continue;
      const thit = 14 + z.size * 11;
      if(Math.abs(z.x - b.x) < thit || (z.x > lo - thit * 0.5 && z.x < hi + thit * 0.5)){
        if(b.splash) explode(b.x, b.lane, b.dmg, b.splash);
        else damageZ(z, b.dmg);
        b.dead = true;
        for(let i = 0; i < 3; i++)
          addPart({type:'spark', x:b.x, y:b.y, vx:rand(-70, 40), vy:rand(-60, 40), g:120,
                   life:rand(0.15, 0.35), maxLife:0.35, size:rand(1, 2.4), color:'#ffe9b0'});
        break;
      }
    }
  }
}

function updateZombies(dt){
  for(const z of G.zombies){
    if(z.dead) continue;
    z.flash = Math.max(0, z.flash - dt * 3.2);

    // 是否被士兵挡住
    let block = null;
    for(const s of G.soldiers){
      if(s.lane !== z.lane || s.hp <= 0) continue;
      if(z.x >= s.x - 8 && z.x - s.x <= 48 + z.size * 10){
        if(!block || s.x > block.x) block = s;
      }
    }

    if(block){
      z.moving = false;
      block.hp -= z.def.dps * dt;
      block.flash = 1;
      if(Math.random() < 0.25)
        addPart({type:'spark', x:block.x + 6, y:block.y - 12, vx:rand(-40, 20), vy:rand(-50, -10),
                 g:120, life:0.25, maxLife:0.25, size:2, color:'#ff9d8a'});
      if(block.hp <= 0){
        for(let i = 0; i < 12; i++)
          addPart({type:'spark', x:block.x, y:block.y - 10, vx:rand(-160, 160), vy:rand(-180, 20),
                   g:280, life:rand(0.25, 0.7), maxLife:0.7, size:rand(1.5, 3.5), color:block.def.accent});
        addPart({type:'ring', x:block.x, y:block.y - 10, life:0.4, maxLife:0.4, size:60, color:block.def.accent});
        sfx('die');
      }
    } else if(z.x <= BASE_X + 16){
      z.moving = false;
      G.baseHp -= z.def.dps * dt * 0.9;
      G.shake = Math.max(G.shake, 3);
      if(Math.random() < 0.3)
        addPart({type:'spark', x:BASE_X + rand(0, 10), y:z.y - rand(4, 20), vx:rand(-30, 30), vy:rand(-40, 10),
                 g:100, life:0.3, maxLife:0.3, size:2.5, color:'#ff5c4d'});
      if(Math.random() < 0.14) toast('基地护盾受损！');
    } else {
      z.moving = true;
      z.x -= z.speed * dt;
      z.walk += dt * (z.speed / 34) * (z.isBoss ? 0.7 : 1);
    }
  }
}

function updateParts(dt){
  for(const p of G.parts){
    p.life -= dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += p.g * dt;
  }
  G.parts = G.parts.filter(p => p.life > 0);
}

function updateWeather(dt){
  const th = G.theme; if(!th) return;
  for(const p of G.weather){
    if(th.weather === 'rain'){ p.x -= 620 * dt; p.y += 1100 * dt; }
    else if(th.weather === 'snow'){ p.x -= 60 * dt; p.y += p.spd * dt; p.sw += dt * 1.6; }
    else if(th.weather === 'dust'){ p.x -= p.spd * 3 * dt; }
    else if(th.weather === 'toxic'){ p.y -= p.spd * dt; p.x += Math.sin(G.time + p.seed) * 8 * dt; }
    else if(th.weather === 'ember'){ p.y -= p.spd * 1.6 * dt; p.x += Math.sin(G.time + p.seed) * 20 * dt; }
    if(p.y > 720 + 20 || p.y < -20 || p.x < -30) resetWeatherP(p, true);
  }
}

/* =========================================================
   结束与结算
   ========================================================= */
function endGame(win){
  if(G.phase !== 'playing') return;
  G.phase = 'result';
  G.gatePaused = false;
  if(window.GameLimit){
    try{ window.GameLimit.count('zombie-defense'); }catch(e){}
  }
  if(win){
    G.whiteFlash = 0.7;
    markCleared(G.lvIdx);
    sfx('win');
  } else {
    G.flash = 1; G.shake = 24;
    sfx('lose');
  }
  setTimeout(() => showResult(win), 620);
}

function showResult(win){
  const lv = G.level;
  document.getElementById('resTitle').innerHTML = win
    ? '防线守住了<span class="thin">SECTOR CLEARED · ' + lv.tag + '</span>'
    : '防线失守<span class="thin">DEFENSE COLLAPSED · 再来一次</span>';
  document.getElementById('resKills').textContent = G.kills;
  document.getElementById('resScore').textContent = G.score;
  document.getElementById('resAlive').textContent = G.soldiers.length;
  document.getElementById('resHp').textContent = Math.max(0, Math.round(G.baseHp));
  document.getElementById('resTips').innerHTML = win
    ? (G.lvIdx < LEVELS.length - 1
        ? '下一关：<span>' + LEVELS[G.lvIdx + 1].name + '</span>，僵尸会更凶。'
        : '全部战场已清空，你就是这条防线。')
    : '提示：<span>重甲兵</span>顶在前面挡路，<span>坦克兵</span>放在后排炸一片。';
  const nextBtn = document.getElementById('btnNext');
  nextBtn.style.display = win && G.lvIdx < LEVELS.length - 1 ? '' : 'none';
  document.getElementById('btnRetry').textContent = win ? '再打一次' : '重打本关';
  showOv('result');
  syncHUD();
}

/* =========================================================
   存档 / 界面
   ========================================================= */
function clearedList(){
  try{ return JSON.parse(localStorage.getItem('steelline_cleared') || '[]'); }catch(e){ return []; }
}
function markCleared(i){
  const list = clearedList();
  if(list.indexOf(i) < 0){ list.push(i); }
  try{ localStorage.setItem('steelline_cleared', JSON.stringify(list)); }catch(e){}
  buildLevelGrid();
}

function showOv(id){
  document.getElementById(id).classList.add('show');
  document.body.classList.add('in-menu');
}
function hideOv(id){
  document.getElementById(id).classList.remove('show');
  const anyOn = ['menu', 'result', 'pause'].some(k => document.getElementById(k).classList.contains('show'));
  if(!anyOn) document.body.classList.remove('in-menu');
}

let toastTimer = null;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.opacity = 1;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.style.opacity = 0; }, 1600);
}

function buildDock(){
  const dock = document.getElementById('dock');
  dock.innerHTML = '';
  ORDER.forEach((key, i) => {
    const d = SOLDIERS[key];
    const el = document.createElement('div');
    el.className = 'card';
    el.style.setProperty('--ac', d.accent);
    el.dataset.key = key;
    el.innerHTML =
      '<div class="card-top">' +
        '<div class="card-ico">' + iconSVG(key, d.accent) + '</div>' +
        '<div><div class="card-name">' + d.name + '</div><div class="card-en">' + d.en + '</div></div>' +
      '</div>' +
      '<div class="card-desc">' + d.desc + '</div>' +
      '<div class="card-key">' + (i + 1) + '</div>' +
      '<div class="cost">' + d.cost + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg></div>';
    el.addEventListener('click', () => {
      if(G.phase !== 'playing') return;
      selectSoldier(key);
    });
    dock.appendChild(el);
  });
}

function selectSoldier(key){
  if(G.sel === key){ G.sel = null; }
  else {
    G.sel = key;
    if(G.energy < SOLDIERS[key].cost) toast('能量不够，先攒一会儿');
  }
  syncDock();
}

function syncDock(){
  const cards = document.querySelectorAll('#dock .card');
  cards.forEach(el => {
    const key = el.dataset.key;
    const def = SOLDIERS[key];
    el.classList.toggle('sel', G.sel === key);
    el.classList.toggle('no', G.energy < def.cost);
  });
}

function syncHUD(){
  if(!G.level) return;
  document.getElementById('lvNum').textContent = G.level.id;
  document.getElementById('lvName').textContent = G.level.name;
  document.getElementById('lvSub').textContent = G.level.tag + ' / ' + G.theme.name;
  const pips = document.getElementById('pips');
  let html = '';
  for(let i = 0; i < G.waveTotal; i++){
    html += '<div class="pip' + (i < G.waveNow - 1 ? ' done' : '') + '"></div>';
  }
  pips.innerHTML = html;
  document.getElementById('hpNum').textContent = Math.max(0, Math.round(G.baseHp));
  const hpPct = clamp(G.baseHp / G.baseMax * 100, 0, 100);
  const hf = document.getElementById('hpFill');
  hf.style.width = hpPct + '%';
  hf.style.filter = hpPct < 35 ? 'saturate(1.5) hue-rotate(-12deg)' : '';
  if(G.boss){
    const pct = Math.max(0, G.boss.hp / G.boss.maxHp * 100);
    document.getElementById('bossFill').style.width = pct + '%';
    document.getElementById('bossHpTxt').textContent = Math.ceil(pct) + '%';
  }
}

function buildLevelGrid(){
  const grid = document.getElementById('levelGrid');
  const cleared = clearedList();
  grid.innerHTML = '';
  LEVELS.forEach((lv, i) => {
    const th = THEMES[lv.theme];
    const el = document.createElement('div');
    el.className = 'lcard' + (lv.waves.some(w => w.boss) ? ' boss' : '');
    el.innerHTML =
      '<div class="lc-shade"></div>' +
      '<div class="lc-idx num">' + lv.tag + '</div>' +
      (cleared.indexOf(i) >= 0 ? '<div class="lc-clear">已通关</div>' : '') +
      '<div class="lc-name">' + lv.name + '</div>' +
      '<div class="lc-sub">' + lv.waves.length + ' 波 · ' + seenTypes(lv) + '</div>';

    // 场景缩略图：直接用当前场景预渲染结果
    buildBackdrop(lv.theme);
    const pv = document.createElement('canvas');
    pv.className = 'lc-pv';
    pv.width = 380; pv.height = 340;
    pv.getContext('2d').drawImage(bgCanvas,
      380 * DPR, 40 * DPR, 520 * DPR, 470 * DPR,
      0, 0, 380, 340);
    el.insertBefore(pv, el.firstChild);

    el.addEventListener('click', () => {
      G.lvIdx = i;
      startLevel(i);
    });
    grid.appendChild(el);
  });
  buildBackdrop(G.level ? G.level.theme : 'city');
}

function seenTypes(lv){
  const set = {};
  lv.waves.forEach(w => w.groups.forEach(g => { set[g.type] = 1; }));
  const out = [];
  Object.keys(set).forEach(k => { if(k !== 'boss') out.push(ZOMBIES[k].name); });
  if(set.boss) out.push('尸王');
  return out.join('/');
}

/* =========================================================
   环境天气粒子
   ========================================================= */
function initWeather(themeKey){
  const th = THEMES[themeKey];
  const n = th.weather === 'rain' ? 150 : th.weather === 'snow' ? 110 : th.weather === 'ember' ? 60 : 90;
  G.weather = [];
  for(let i = 0; i < n; i++){
    const p = {seed:rand(0, 10), sw:0};
    resetWeatherP(p, false, true);
    G.weather.push(p);
  }
}

function resetWeatherP(p, anywhere){
  const th = G.theme;
  p.seed = p.seed || rand(0, 10);
  p.x = rand(-40, W + 40);
  p.y = anywhere ? rand(-40, H) : (th.weather === 'toxic' || th.weather === 'ember' ? rand(H * 0.5, H + 40) : rand(-60, H * 0.6));
  if(th.weather === 'rain'){ p.spd = rand(0, 1); p.len = rand(12, 30); }
  else if(th.weather === 'snow'){ p.spd = rand(28, 70); p.r = rand(1, 2.8); p.sw = rand(0, 6.28); }
  else if(th.weather === 'dust'){ p.spd = rand(60, 180); p.len = rand(20, 70); }
  else if(th.weather === 'toxic'){ p.spd = rand(18, 46); p.r = rand(1, 3.4); }
  else { p.spd = rand(30, 80); p.r = rand(1, 2.6); }
}

/* =========================================================
   绘制工具
   ========================================================= */
const bgCanvas = document.createElement('canvas');
bgCanvas.width = W * DPR; bgCanvas.height = H * DPR;
const bgc = bgCanvas.getContext('2d');
bgc.scale(DPR, DPR);

function hexA(hex, a){
  const h = hex.replace('#', '');
  const r = parseInt(h.substring(0, 2), 16), g = parseInt(h.substring(2, 4), 16), b = parseInt(h.substring(4, 6), 16);
  return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
}
function mixHex(a, b, k){ return a; }

function pathRR(c, x, y, w, h, r){
  const rad = Math.min(r, w / 2, h / 2);
  c.beginPath();
  c.moveTo(x + rad, y);
  c.lineTo(x + w - rad, y); c.quadraticCurveTo(x + w, y, x + w, y + rad);
  c.lineTo(x + w, y + h - rad); c.quadraticCurveTo(x + w, y + h, x + w - rad, y + h);
  c.lineTo(x + rad, y + h); c.quadraticCurveTo(x, y + h, x, y + h - rad);
  c.lineTo(x, y + rad); c.quadraticCurveTo(x, y, x + rad, y);
  c.closePath();
}

/* =========================================================
   背景（每关预渲染一次）
   ========================================================= */
const bgCache = {};
function buildBackdrop(key){
  if(bgCache[key]){
    bgc.clearRect(0, 0, W, H);
    bgc.drawImage(bgCache[key], 0, 0, W, H);
    return;
  }
  const th = THEMES[key];
  bgc.clearRect(0, 0, W, H);

  // 天空
  const sky = bgc.createLinearGradient(0, 0, 0, 215);
  sky.addColorStop(0, th.sky[0]); sky.addColorStop(0.55, th.sky[1]); sky.addColorStop(1, th.sky[2]);
  bgc.fillStyle = sky; bgc.fillRect(0, 0, W, 215);

  // 地面
  const gr = bgc.createLinearGradient(0, 150, 0, H);
  gr.addColorStop(0, th.ground[0]); gr.addColorStop(1, th.ground[1]);
  bgc.fillStyle = gr; bgc.fillRect(0, 150, W, H - 150);

  // 地平线光晕
  const hg = bgc.createRadialGradient(W * 0.74, 168, 0, W * 0.74, 168, 760);
  hg.addColorStop(0, hexA(th.accent, 0.20)); hg.addColorStop(0.5, hexA(th.accent, 0.06)); hg.addColorStop(1, 'rgba(0,0,0,0)');
  bgc.fillStyle = hg; bgc.fillRect(0, 0, W, 560);

  if(key === 'city') bgCity(th);
  else if(key === 'desert') bgDesert(th);
  else if(key === 'snow') bgSnow(th);
  else if(key === 'factory') bgFactory(th);
  else bgFortress(th);

  drawField(th);

  const snap = document.createElement('canvas');
  snap.width = W * DPR; snap.height = H * DPR;
  snap.getContext('2d').drawImage(bgCanvas, 0, 0);
  bgCache[key] = snap;
}

/* ------- 城市废墟 ------- */
function bgCity(th){
  // 远景楼群
  let x = -30;
  while(x < W + 40){
    const w = rand(40, 96), h = rand(40, 110);
    bgc.fillStyle = 'rgba(8,16,24,0.92)';
    bgc.fillRect(x, 150 - h, w, h + 60);
    // 窗户
    for(let yy = 150 - h + 8; yy < 146; yy += 9){
      for(let xx = x + 5; xx < x + w - 5; xx += 8){
        if(Math.random() < 0.32){
          bgc.fillStyle = Math.random() < 0.5 ? 'rgba(255,181,69,0.55)' : 'rgba(95,240,255,0.35)';
          bgc.fillRect(xx, yy, 3, 4);
        }
      }
    }
    x += w + rand(6, 22);
  }
  // 霓虹条
  const neon = th.neon;
  for(let i = 0; i < 7; i++){
    const nx = rand(240, W - 160), ny = rand(40, 130), w = rand(40, 110);
    bgc.fillStyle = hexA(neon[i % neon.length], 0.85);
    bgc.fillRect(nx, ny, w, 3);
    bgc.fillStyle = hexA(neon[i % neon.length], 0.16);
    bgc.fillRect(nx - 6, ny - 6, w + 12, 15);
  }
  // 近景立柱 + 天线
  bgc.fillStyle = 'rgba(6,12,18,0.95)';
  bgc.fillRect(120, 40, 26, 120); bgc.fillRect(W - 240, 22, 18, 138);
  bgc.fillRect(112, 34, 42, 8);

/* ------- 通用赛道 ------- */
function drawField(th){
  const fieldTop = LANE_TOP, fieldH = LANE_H * LANES;
  // 环境光（斜向光柱）
  for(let i = 0; i < 6; i++){
    const sx = 260 + i * 190;
    bgc.save();
    bgc.globalCompositeOperation = 'lighter';
    const lsh = bgc.createLinearGradient(sx, 0, sx + 120, fieldTop + fieldH);
    lsh.addColorStop(0, hexA(th.accent, 0.10));
    lsh.addColorStop(1, 'rgba(0,0,0,0)');
    bgc.fillStyle = lsh;
    bgc.beginPath();
    bgc.moveTo(sx, fieldTop); bgc.lineTo(sx + 60, fieldTop);
    bgc.lineTo(sx + 150, fieldTop + fieldH); bgc.lineTo(sx + 20, fieldTop + fieldH);
    bgc.closePath(); bgc.fill();
    bgc.restore();
  }
  // 中心暖光
  const amb = bgc.createRadialGradient(W * 0.6, fieldTop + fieldH * 0.5, 30, W * 0.6, fieldTop + fieldH * 0.5, 760);
  amb.addColorStop(0, hexA(th.accent, 0.14));
  amb.addColorStop(0.5, hexA(th.accent, 0.05));
  amb.addColorStop(1, 'rgba(0,0,0,0)');
  bgc.fillStyle = amb; bgc.fillRect(0, fieldTop, W, fieldH);
  // 赛道底色 + 分隔
  for(let i = 0; i < LANES; i++){
    const y0 = LANE_TOP + i * LANE_H, y1 = y0 + LANE_H;
    const g = bgc.createLinearGradient(0, y0, 0, y1);
    g.addColorStop(0, 'rgba(255,255,255,0.075)');
    g.addColorStop(0.5, 'rgba(255,255,255,0.022)');
    g.addColorStop(1, 'rgba(255,255,255,0.075)');
    bgc.fillStyle = g; bgc.fillRect(0, y0, W, LANE_H);
  }
  bgc.strokeStyle = 'rgba(255,255,255,0.12)';
  bgc.lineWidth = 1;
  for(let i = 1; i < LANES; i++){
    const y = LANE_TOP + i * LANE_H;
    bgc.beginPath(); bgc.moveTo(0, y); bgc.lineTo(W, y); bgc.stroke();
  }
  // 路面虚线（每条赛道中线）
  bgc.setLineDash([30, 34]);
  bgc.strokeStyle = hexA(th.accent, 0.17);
  bgc.lineWidth = 2;
  for(let i = 0; i < LANES; i++){
    const y = LANE_Y[i];
    bgc.beginPath(); bgc.moveTo(150, y + 2); bgc.lineTo(W, y + 2); bgc.stroke();
  }
  bgc.setLineDash([]);

  // 地面碎屑
  for(let i = 0; i < 70; i++){
    const x = rand(140, W), y = rand(LANE_TOP + 6, LANE_TOP + LANE_H * LANES - 6);
    bgc.fillStyle = 'rgba(255,255,255,' + rand(0.02, 0.07).toFixed(3) + ')';
    bgc.fillRect(x, y, rand(2, 9), rand(1, 3));
  }
  // 右侧"外面"的裂口
  const rg = bgc.createLinearGradient(W - 250, 0, W, 0);
  rg.addColorStop(0, 'rgba(0,0,0,0)'); rg.addColorStop(1, 'rgba(4,2,4,0.92)');
  bgc.fillStyle = rg; bgc.fillRect(W - 250, LANE_TOP, 250, LANE_H * LANES);
  for(let i = 0; i < LANES; i++){
    const y = LANE_TOP + i * LANE_H;
    for(let k = 0; k < 4; k++){
      bgc.fillStyle = 'rgba(255,92,77,' + (0.35 - k * 0.07) + ')';
      bgc.fillRect(W - 30 - k * 12, y + 6, 6, LANE_H - 12);
    }
  }
  // 顶部与底部渐隐
  const tg = bgc.createLinearGradient(0, LANE_TOP - 10, 0, LANE_TOP + 16);
  tg.addColorStop(0, 'rgba(0,0,0,0.55)'); tg.addColorStop(1, 'rgba(0,0,0,0)');
  bgc.fillStyle = tg; bgc.fillRect(0, LANE_TOP - 10, W, 26);
  const bg2 = bgc.createLinearGradient(0, H - 130, 0, H);
  bg2.addColorStop(0, 'rgba(0,0,0,0)'); bg2.addColorStop(1, 'rgba(0,0,0,0.72)');
  bgc.fillStyle = bg2; bgc.fillRect(0, H - 130, W, 130);
}

/* =========================================================
   主渲染
   ========================================================= */
function render(){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  if(G.shake > 0.5) ctx.translate(rand(-G.shake, G.shake) * 0.6, rand(-G.shake, G.shake) * 0.4);

  if(G.theme) ctx.drawImage(bgCanvas, 0, 0, W, H);
  else { ctx.fillStyle = '#080d12'; ctx.fillRect(0, 0, W, H); }

  drawLaneGlow();
  drawBase();
  drawSpawnZone();

  if(G.phase !== 'menu'){
    const sorted = G.zombies.slice().sort((a, b) => a.lane - b.lane);
    for(const s of G.soldiers) drawSoldier(s);
    for(const z of sorted) drawZombie(z);
    for(const b of G.bullets) drawBullet(b);
  }
  drawParticles();
  drawWeather();
  drawDeployGhost();
  drawOverlayFx();
  ctx.restore();
}

/* ------- 赛道动态光 ------- */
function drawLaneGlow(){
  const t = G.time;
  for(let i = 0; i < LANES; i++){
    if(G.hoverLane === i && G.sel){
      ctx.fillStyle = 'rgba(255,181,69,' + (0.05 + 0.02 * Math.sin(t * 6)) + ')';
      ctx.fillRect(140, LANE_TOP + i * LANE_H, W - 140, LANE_H);
    }
    const y = LANE_Y[i] + 2;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createLinearGradient(140, 0, W, 0);
    g.addColorStop(0, 'rgba(127,227,255,0.10)');
    g.addColorStop(0.35, 'rgba(127,227,255,0.03)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(140, y - 1.5, W - 140, 3);
    ctx.restore();
  }
}

/* ------- 左侧基地 ------- */
function drawBase(){
  const top = LANE_TOP - 4, bot = LANE_TOP + LANE_H * LANES + 4, hgt = bot - top;
  const pct = G.baseMax ? clamp(G.baseHp / G.baseMax, 0, 1) : 1;
  const t = G.time;

  // 墙体
  const g = ctx.createLinearGradient(24, 0, 128, 0);
  g.addColorStop(0, '#40545f'); g.addColorStop(0.45, '#27363f'); g.addColorStop(1, '#151f25');
  ctx.fillStyle = g;
  pathRR(ctx, 22, top, 106, hgt, 5); ctx.fill();

  // 面板分割
  ctx.strokeStyle = 'rgba(255,255,255,0.16)'; ctx.lineWidth = 1;
  for(let y = top + 26; y < bot; y += 52){
    ctx.beginPath(); ctx.moveTo(26, y); ctx.lineTo(124, y); ctx.stroke();
  }
  // 铆钉
  for(let y = top + 14; y < bot; y += 26){
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.beginPath(); ctx.arc(32, y, 1.6, 0, 6.3); ctx.fill();
    ctx.beginPath(); ctx.arc(118, y, 1.6, 0, 6.3); ctx.fill();
  }

  // 中央能量核心
  const cx = 76, cy = top + hgt / 2;
  const pulse = 0.55 + 0.45 * Math.sin(t * 2.2);
  const core = ctx.createRadialGradient(cx, cy, 2, cx, cy, 46);
  core.addColorStop(0, 'rgba(127,227,255,' + (0.85 * (0.4 + pct * 0.6)) + ')');
  core.addColorStop(0.5, 'rgba(127,227,255,0.18)');
  core.addColorStop(1, 'rgba(127,227,255,0)');
  ctx.fillStyle = core;
  ctx.beginPath(); ctx.arc(cx, cy, 46, 0, 6.3); ctx.fill();
  // 六边形
  ctx.strokeStyle = pct > 0.35 ? 'rgba(127,227,255,' + (0.5 + pulse * 0.4) + ')' : 'rgba(255,92,77,' + (0.5 + pulse * 0.4) + ')';
  ctx.lineWidth = 2;
  ctx.beginPath();
  for(let i = 0; i < 6; i++){
    const a = i / 6 * 6.283 + t * 0.4;
    const px = cx + Math.cos(a) * 22, py = cy + Math.sin(a) * 22;
    if(i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath(); ctx.stroke();
  ctx.fillStyle = pct > 0.35 ? 'rgba(127,227,255,0.9)' : 'rgba(255,92,77,0.9)';
  ctx.beginPath(); ctx.arc(cx, cy, 6 + pulse * 2, 0, 6.3); ctx.fill();

  // 能量屏障
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const bar = ctx.createLinearGradient(132, 0, 152, 0);
  bar.addColorStop(0, pct > 0.35 ? 'rgba(140,240,255,0.62)' : 'rgba(255,92,77,0.6)');
  bar.addColorStop(0.6, pct > 0.35 ? 'rgba(127,227,255,0.12)' : 'rgba(255,92,77,0.12)');
  bar.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = bar;
  ctx.fillRect(130, top, 26, hgt);
  // 扫描线
  const scanY = top + ((t * 120) % hgt);
  ctx.fillStyle = 'rgba(200,245,255,0.20)';
  ctx.fillRect(132, scanY, 18, 2);
  ctx.restore();
  ctx.strokeStyle = 'rgba(127,227,255,0.28)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(142, top); ctx.lineTo(142, bot); ctx.stroke();
}

/* ------- 右端出怪区 ------- */
function drawSpawnZone(){
  const t = G.time;
  const top = LANE_TOP, bot = LANE_TOP + LANE_H * LANES;
  ctx.save();
  const g = ctx.createLinearGradient(W - 120, 0, W, 0);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = g; ctx.fillRect(W - 120, top, 120, bot - top);
  for(let i = 0; i < LANES; i++){
    const y = LANE_Y[i];
    const a = 0.18 + 0.12 * Math.sin(t * 3 + i);
    ctx.fillStyle = 'rgba(255,92,77,' + a + ')';
    for(let k = 0; k < 3; k++){
      const px = W - 16 - k * 9;
      ctx.beginPath();
      ctx.moveTo(px, y - 8); ctx.lineTo(px - 6, y); ctx.lineTo(px, y + 8);
      ctx.strokeStyle = 'rgba(255,92,77,' + a + ')'; ctx.lineWidth = 2; ctx.stroke();
    }
  }
  ctx.restore();
}

/* =========================================================
   实体绘制：士兵
   ========================================================= */
const OUT = 'rgba(4,8,10,0.88)';
function ol(w){ ctx.strokeStyle = OUT; ctx.lineWidth = w || 1.6; ctx.stroke(); }

function drawSoldier(s){
  const t = G.time;
  const bob = s.born > 0 ? Math.sin(t * 22) * 2 : Math.sin(t * 2.0 + s.id) * 1.4;
  const yb = s.y + 36 + bob;
  const x = s.x - s.recoil * 1.8;
  const acc = s.def.accent;

  // 地面聚光
  const lg = ctx.createRadialGradient(s.x, s.y + 30, 2, s.x, s.y + 30, 46);
  lg.addColorStop(0, hexA(acc, 0.18)); lg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = lg;
  ctx.beginPath(); ctx.ellipse(s.x, s.y + 30, 46, 16, 0, 0, 6.3); ctx.fill();
  // 影子
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.beginPath(); ctx.ellipse(s.x + 3, s.y + 33, 23, 7, 0, 0, 6.3); ctx.fill();

  ctx.save();
  ctx.translate(x, yb);
  ctx.scale(1.12, 1.12);
  if(s.key === 'pistol') drawPistolSoldier(0, 0, acc, s);
  else if(s.key === 'gatling') drawGatlingSoldier(0, 0, acc, s);
  else if(s.key === 'heavy') drawHeavySoldier(0, 0, acc, s);
  else drawTankSoldier(0, 0, acc, s);
  ctx.restore();

  // 命中闪白
  if(s.flash > 0.2){
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(255,140,110,' + (s.flash * 0.22) + ')';
    ctx.beginPath(); ctx.ellipse(x, yb - 24, 24, 34, 0, 0, 6.3); ctx.fill();
    ctx.restore();
  }
  // 血条
  if(s.hp < s.maxHp){
    const w = 44, h = 4, bx = x - w / 2, by = yb - 90;
    ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(bx - 1, by - 1, w + 2, h + 2);
    ctx.fillStyle = s.hp / s.maxHp > 0.4 ? '#7fe3ff' : '#ff7a5c';
    ctx.fillRect(bx, by, w * clamp(s.hp / s.maxHp, 0, 1), h);
  }
}

/* ------- 手枪兵 ------- */
function drawPistolSoldier(x, yb, acc, s){
  // 腿
  ctx.fillStyle = '#22323d';
  pathRR(ctx, x - 12, yb - 36, 10, 32, 2); ctx.fill(); ol(1.4);
  pathRR(ctx, x + 2, yb - 36, 10, 32, 2); ctx.fill(); ol(1.4);
  ctx.fillStyle = '#0d151b';
  pathRR(ctx, x - 14, yb - 7, 13, 7, 2); ctx.fill();
  pathRR(ctx, x + 1, yb - 7, 13, 7, 2); ctx.fill();

  // 躯干
  const tg = ctx.createLinearGradient(x - 16, 0, x + 16, 0);
  tg.addColorStop(0, '#4d8095'); tg.addColorStop(0.55, '#36606f'); tg.addColorStop(1, '#22323c');
  ctx.fillStyle = tg;
  pathRR(ctx, x - 15, yb - 64, 30, 31, 6); ctx.fill(); ol(1.8);
  // 胸甲
  ctx.fillStyle = hexA(acc, 0.30);
  pathRR(ctx, x - 12, yb - 56, 24, 14, 3); ctx.fill();
  ctx.strokeStyle = hexA(acc, 0.75); ctx.lineWidth = 1;
  pathRR(ctx, x - 12, yb - 56, 24, 14, 3); ctx.stroke();
  // 腰带
  ctx.fillStyle = '#131c22';
  ctx.fillRect(x - 15, yb - 30, 30, 4);
  // 顶部轮廓光
  ctx.strokeStyle = hexA(acc, 0.55); ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(x - 13, yb - 60); ctx.quadraticCurveTo(x, yb - 65, x + 13, yb - 60); ctx.stroke();
  // 肩甲
  ctx.fillStyle = '#2c4653';
  ctx.beginPath(); ctx.arc(x - 15, yb - 58, 7, 0, 6.3); ctx.fill(); ol(1.3);
  // 手臂 + 手枪
  ctx.fillStyle = '#3a6172';
  pathRR(ctx, x + 6, yb - 55, 16, 8, 3); ctx.fill(); ol(1.3);
  ctx.fillStyle = '#0c1318';
